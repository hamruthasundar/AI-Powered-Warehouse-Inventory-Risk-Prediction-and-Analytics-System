<!DOCTYPE html>
<html>

<head>

<title>Warehouse Login</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="login-body">

<div class="login-box">

<h1>Warehouse AI System</h1>

<form method="POST">

<input type="text"
name="username"
placeholder="Username"
required>

<input type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

{% if error %}

<p class="error">

{{ error }}

</p>

{% endif %}

</div>

</body>
</html>
